name: Package editor release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0-preview.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Package
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') { throw 'Invalid release tag' }
          ./scripts/package-editor.ps1 -Version $env:TAG.Substring(1)
      - name: Publish preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $assets = Get-ChildItem artifacts -File | Where-Object { $_.Name -match '\.zip(?:\.sha256)?$' } | Select-Object -ExpandProperty FullName
          gh release create $env:TAG @assets --verify-tag --prerelease --title "GameplayMachine $env:TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
